# Source: Preciosa Ornela info card. Sizes are official ranges. Length and hole
# are not published: lengths are estimates and holes come from retailers.
brand: preciosa
name: Preciosa Ornela
country: CZ
sources:
  - https://www.preciosa-ornela.com/content/files/downloads/infocards/PRECIOSA_Rocailles.pdf
lines:
  rocailles:
    name: Rocailles (round hole)
    shape: round
    article: 311 19 001
    code: "{size} {color}"
    sizes:
      15/0: { outer_diameter: { min: 1.4, max: 1.5 }, length: 1.0, beads_per_gram: 625 }
      11/0: { outer_diameter: { min: 2.0, max: 2.2 }, length: 1.5, beads_per_gram: 130 }
      10/0: { outer_diameter: { min: 2.2, max: 2.4 }, length: 1.6, hole: 0.8, beads_per_gram: 91 }
      8/0:  { outer_diameter: { min: 2.8, max: 3.2 }, length: 2.1, hole: 0.9, beads_per_gram: 42 }
      6/0:  { outer_diameter: { min: 3.7, max: 4.3 }, length: 2.9, hole: 0.9, beads_per_gram: 13.3 }
    basis: { default: official, length: estimate, hole: retailer }
    colors:
      "23980": { name: opaque jet black, display: { rgb: "#0f0f0f" } }
      "78102": { name: crystal silver-lined, display: { rgb: "#e4e8ec", opacity: 0.6, finish: [silver-lined] } }
