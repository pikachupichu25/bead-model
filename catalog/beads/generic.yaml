# Typical sizes for patterns that don't name a brand. See docs/bead-catalog.md.
# Values are close to Miyuki's, and marked `estimate` so patterns that rely on
# them get a warning. Generic beads have no colors: the pattern gives the color.
brand: generic
name: Generic
lines:
  cylinder:
    name: Cylinder bead
    shape: cylinder
    code: "{size} cylinder"
    sizes:
      15/0: { outer_diameter: 1.3, length: 1.15, hole: 0.65 }
      11/0: { outer_diameter: 1.6, length: 1.3, hole: 0.8 }
      10/0: { outer_diameter: 2.2, length: 1.7, hole: 1.0 }
      8/0:  { outer_diameter: 3.0, length: 2.7, hole: 1.5 }
    basis: { default: estimate }
  round:
    name: Round seed bead
    shape: round
    code: "{size} round"
    sizes:
      15/0: { outer_diameter: 1.5, length: 1.0, hole: 0.7 }
      11/0: { outer_diameter: 2.0, length: 1.45, hole: 0.8 }
      10/0: { outer_diameter: 2.3, length: 1.6, hole: 0.8 }
      8/0:  { outer_diameter: 3.0, length: 2.1, hole: 1.1 }
      6/0:  { outer_diameter: 4.0, length: 2.9, hole: 1.5 }
    basis: { default: estimate }
