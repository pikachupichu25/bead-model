      "143":   { name: ceylon aqua, sizes: ["01"], display: { rgb: "#a8d8d4", finish: [pearl] } }
      "147":   { name: ceylon light ivory, sizes: ["01"], display: { rgb: "#f0e6cc", finish: [pearl] } }
