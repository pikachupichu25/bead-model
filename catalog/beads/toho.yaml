      "2":     { name: transparent light topaz, sizes: ["01"], display: { rgb: "#e0b060", opacity: 0.6 } }
      "3":     { name: transparent aquamarine, sizes: ["01"], display: { rgb: "#80c8d0", opacity: 0.6 } }
      "8":     { name: transparent cobalt, sizes: ["01"], display: { rgb: "#1f3c9a", opacity: 0.6 } }
