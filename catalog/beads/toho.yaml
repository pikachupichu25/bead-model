# Toho publishes beads per kg only. Sizes here come from retailers or are
# estimates, so measure before relying on them (see docs/bead-research.md §5).
# Code templates: TR (round) and TT-01 (Treasure 11/0) are seen at retailers;
# TDR, TB and TT-08 (Treasure 3.3 mm) are unverified.
# Treasure color names follow Perles & Co's listings, plus a few from
# Serendipity Beads and i-beads. Display colors are set from the names.
brand: toho
name: Toho
country: JP
sources:
  - https://www.tohobeads.net/grainbeads/
  - https://www.perlesandco.co.uk/resources/ft29351-miyuki-vs-toho.html
  - https://www.perlesandco.co.uk/toho-toho-treasures-1.8-mm-c-55_2527_405.html
  - https://www.perlesandco.co.uk/toho-toho-treasures-3.3-mm-c-55_2527_727.html
  - https://beadsonline.com.au/toho-33954.html
  - https://www.serendipitybeads.co.nz/Category_13/all/TOHO-TREASURE-CYLINDER-BEADS.htm
lines:
  round:
    name: Round
    shape: round
    code: "TR-{size}-{color}"
    sizes:
      "15": { label: 15/0, outer_diameter: 1.5, length: 1.0, hole: 0.6, beads_per_gram: 269 }
      "11": { label: 11/0, outer_diameter: 2.2, length: 1.5, hole: 0.8, beads_per_gram: 105 }
      "08": { label: 8/0,  outer_diameter: 3.0, length: 2.2, hole: 1.0, beads_per_gram: 42 }
      "06": { label: 6/0,  outer_diameter: 4.0, length: 2.9, hole: 1.3, beads_per_gram: 17 }
    basis: { default: retailer, length: estimate, beads_per_gram: official }
    colors:
      "21":  { name: silver-lined crystal, display: { rgb: "#e4e8ec", opacity: 0.6, finish: [silver-lined] } }
      "49":  { name: opaque jet, display: { rgb: "#111111" } }
      "49F": { name: opaque frosted jet, display: { rgb: "#262626", finish: [matte] } }
  demi:
    name: Demi Round
    shape: demi
    code: "TDR-{size}-{color}"
    sizes:
      "11": { label: 11/0, outer_diameter: 2.2, length: 0.9, hole: 0.8, beads_per_gram: 186 }
    basis: { default: retailer, beads_per_gram: official }
  aiko:
    name: Aiko
    shape: cylinder
    code: "TB-{size}-{color}"
    sizes:
      "11": { label: 11/0, outer_diameter: 1.8, length: 1.5, hole: 0.8, beads_per_gram: 186 }
    basis: { default: retailer, beads_per_gram: official }
  treasure:
    name: Treasure
    shape: cylinder
    code: "TT-{size}-{color}"
    sizes:
      # 11/0 is sold as 1.8 mm; some shops list 1.7 x 1.3 mm with a 0.7 mm hole.
      "01": { label: 11/0, outer_diameter: 1.8, length: 1.3, hole: 0.7, beads_per_gram: 186 }
      # 8/0 is sold as 3.3 mm: Perles & Co gives a 3.1 mm height and 1.7 mm hole.
      "08": { label: 8/0, outer_diameter: 3.3, length: 3.1, hole: 1.7 }
    basis: { default: retailer, beads_per_gram: official }
    colors:
      # Sold in both sizes
      "49F":   { name: opaque frosted jet, display: { rgb: "#262626", finish: [matte] } }
      "123":   { name: opaque luster light beige, display: { rgb: "#e6d8bc", finish: [luster] } }
      "221":   { name: metallic bronze, display: { rgb: "#7a5a34", finish: [metallic] } }
      "557":   { name: galvanized starlight, display: { rgb: "#c8c4b8", finish: [metallic] } }
      "614":   { name: matte iris brown, display: { rgb: "#3e2e24", finish: [matte, metallic] } }
      "617":   { name: matte dark olive, display: { rgb: "#4a4a2a", finish: [matte] } }
      "703":   { name: matte mauve mocha, display: { rgb: "#5a3a3e", finish: [matte] } }
      # 3.3 mm only, as far as checked
      "82":    { name: metallic nebula, sizes: ["08"], display: { rgb: "#3a3050", finish: [metallic] } }
      # 11/0 only, as far as checked
      # Opaque
      "41":    { name: opaque white, sizes: ["01"], display: { rgb: "#f4f4f0" } }
      "41F":   { name: opaque frosted white, sizes: ["01"], display: { rgb: "#ecece6", finish: [matte] } }
      "43":    { name: opaque blue turquoise, sizes: ["01"], display: { rgb: "#2a9ab0" } }
      "45A":   { name: opaque cherry, sizes: ["01"], display: { rgb: "#a8162a" } }
      "49":    { name: opaque jet, sizes: ["01"], display: { rgb: "#111111" } }
      "51":    { name: opaque light beige, sizes: ["01"], display: { rgb: "#e8dcc4" } }
      "51F":   { name: opaque frosted light beige, sizes: ["01"], display: { rgb: "#ddd2bc", finish: [matte] } }
      "55":    { name: opaque turquoise, sizes: ["01"], display: { rgb: "#3cb4b4" } }
