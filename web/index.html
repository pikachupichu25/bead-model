<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peyote Steps</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='9' width='10' height='14' rx='4' fill='%234e79a7'/%3E%3Crect x='18' y='9' width='10' height='14' rx='4' fill='%23e15759'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="gallery-page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span>Peyote Steps</span>
        <nav class="page-nav" id="page-nav" aria-label="Pages"></nav>
      </div>
    </header>

    <div class="notice" id="notice" hidden></div>

    <main class="gallery">
      <section class="home-hero">
        <h1>Designs and beads</h1>
        <label class="home-search">
          <span class="visually-hidden">Search designs and beads</span>
          <input type="search" id="search" placeholder="Search designs and beads, e.g. whale, heart, DB-0010, silver" autocomplete="off" />
        </label>
        <div class="kind-filter" id="kind-filter" role="radiogroup" aria-label="Technique"></div>
      </section>

      <section class="start-row" id="start-row" aria-labelledby="start-title">
        <h2 id="start-title" class="visually-hidden">Start a design</h2>
        <a class="start-tile" href="./editor.html#new"><b>+ Circular peyote</b><span class="muted">Rounds from a ring or a tube, in 3D</span></a>
        <a class="start-tile" href="./flat.html#new"><b>+ Flat peyote</b><span class="muted">Paint a flat piece, or start from a picture</span></a>
        <a class="start-tile" href="./nora.html#new"><b>+ Nora net</b><span class="muted">Rings of 4 and 8 beads, with symmetry</span></a>
      </section>

      <section class="feed-section" id="bead-results" aria-labelledby="bead-results-title" hidden>
        <div class="feed-head">
          <h2 id="bead-results-title">Beads</h2>
          <span class="muted" id="bead-results-count"></span>
          <span class="spacer"></span>
          <a href="./beads.html" class="muted">All my beads →</a>
        </div>
        <ul class="color-grid search-colors" id="bead-list" aria-label="Beads"></ul>
      </section>

      <section class="feed-section" id="pinned" aria-labelledby="pinned-title" hidden>
        <div class="feed-head"><h2 id="pinned-title">Pinned</h2></div>
        <div class="card-grid" id="pinned-list"></div>
      </section>

      <section class="feed-section" aria-labelledby="feed-title">
        <div class="feed-head">
          <h2 id="feed-title">New</h2>
          <span class="muted" id="feed-count"></span>
        </div>
        <div class="card-grid" id="feed-list"></div>
      </section>
    </main>

    <script type="module" src="./home.ts"></script>
  </body>
</html>
