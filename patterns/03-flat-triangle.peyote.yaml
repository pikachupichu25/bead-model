# Reference 3, see docs/references/03-flat-triangle.md
title: Flat peyote triangle
source: https://www.clearlyhelena.com/2014/10/triangle-shape-with-peyote-stitch-how-to.html
status: unverified
beads:
  A: { size: 11/0, shape: round, color: "corners" }
  B: { size: 11/0, shape: round, color: "sides" }
start: center 3A
rounds:
  2: (2A) x3                      # 3 corner pairs
  # Each side: a single, a new pair inside the corner pair, then singles.
  # Round 2 starts with a pair, so its step-up goes through both beads and
  # round 3 starts after the first corner (1B, 2A per side, no fill). Later
  # rounds start with a single, just before a corner pair.
  3-10: (1B, 2A, 1B*) x3
